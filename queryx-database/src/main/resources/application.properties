spring.application.name=queryx

# ============================================================
# Datasource - Supabase PostgreSQL
# Set these environment variables before starting the application:
#   DB_URL      = jdbc:postgresql://<host>:<port>/<database>
#   DB_USERNAME = <your-supabase-db-user>
#   DB_PASSWORD = <your-supabase-db-password>
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ddl-auto=validate: Hibernate validates schema matches entities
# but does NOT create or alter tables (Flyway handles that).
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# Flyway - Database Migration
# Flyway will automatically apply unapplied migrations from
# classpath:db/migration on application startup.
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================================
# HikariCP - Connection Pool
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# Logging
# ============================================================
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=WARN
